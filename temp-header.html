
    <header>
      <div class="left">
        <!-- Menu button -->
        <button
          id="menu"
          class="menu"
          aria-label="Abrir menú lateral"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <!-- Brand -->
        <a href="/" class="brand">
          <img
            src="./public/icons/dragon.svg"
            alt="Dragon Campus"
            class="logo"
          />
          <span class="name">Campus 20 Oriente</span>
        </a>
      </div>
      <div class="center">
        <div class="input-search">
          <input
            type="text"
            placeholder="Buscar aula, docente, alumno..."
            spellcheck="false"
            autocomplete="off"
          />
          <button>
            <i class="fa-solid fa-magnifying-glass fa-2x"></i>
          </button>
        </div>
      </div>

      <div class="right">
        <!-- Notifications -->

        <div class="utility-bar">
          <div class="weather">
            <i class="fa-solid fa-sun"></i>

            <div>
              <strong>25 °C</strong>
              <small>Despejado | <i class="fa-solid fa-wind"></i>10 km/h</small>
            </div>
          </div>
        </div>
        <a href="#" aria-label="Notificaciones">
          <img src="./public/icons/notification.svg" alt="" />
        </a>
        <!-- User avatar -->
        <img
          src="./public/icons/user.svg"
          alt="Perfil del usuario"
          class="user"
        />
        <!-- Open panel button -->
        <button
          class="info-panel-button"
          aria-controls="info-panel"
          aria-expanded="false"
        >
          <i class="fa-solid fa-table-columns fa-2x"></i>
        </button>
      </div>
    </header>
